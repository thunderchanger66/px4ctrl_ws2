# Bare Gazebo X500: PX4 local NED feedback and automatic airborne takeover.
# The reference is published directly in PX4 local NED, so no external
# odometry stream and no frame alignment are required.
px4ctrl:
  ros__parameters:
    use_sim_time: true
    entry_mode: airborne_takeover
    reference_frame: px4_local_ned
    desired_state_topic: /px4ctrl/desired_state
    px4_status_topic: /fmu/out/vehicle_status_v4
    px4_attitude_topic: /fmu/out/vehicle_attitude
    px4_local_position_topic: /fmu/out/vehicle_local_position_v1
    offboard_control_mode_topic: /fmu/in/offboard_control_mode
    attitude_setpoint_topic: /fmu/in/vehicle_attitude_setpoint_v1
    vehicle_command_topic: /fmu/in/vehicle_command
    status_topic: /px4ctrl/status
    debug_topic: /px4ctrl/debug
    publish_rate_hz: 100.0
    command_timeout_sec: 0.50
    # VehicleStatus is a low-rate PX4 state stream in this SITL setup.
    px4_status_timeout_sec: 1.50
    local_position_timeout_sec: 0.50
    # Unchanged PX4 land detection is published once per second.
    land_detected_timeout_sec: 2.0
    local_position_fault_delay_sec: 1.0
    prestream_seconds: 1.0
    start_offboard_on_first_command: false
    arm_on_first_command: false
    takeover_velocity_tolerance_mps: 0.20
    require_takeover_permission: true
    takeover_permission_topic: /eight/takeover_allowed
    gravity_mps2: 9.81
    # Measured hover thrust of the bare Gazebo X500 in this simulation.
    # Regressed from 319 samples of (commanded thrust, measured vertical
    # acceleration): T_hover = 0.699 +/- 0.042.  PX4's own MPC_THR_HOVER is
    # 0.60, but that value is only a nominal scale for PX4's own position
    # loop -- px4ctrl must use the measured value because its integral is
    # frozen while the velocity error is large and cannot absorb the gap.
    # Re-calibrate after changing the airframe, battery or props.
    hover_thrust: 0.697
    min_thrust: 0.08
    max_thrust: 0.95
    max_tilt_deg: 30.0
    max_acceleration_mps2: 6.0
    require_local_position_valid: true
    max_local_position_m: 100.0
    max_local_velocity_mps: 15.0
    land_on_safety_fault: true
    auto_takeoff_altitude_m: 0.0
    minimum_takeoff_altitude_m: 0.0
    minimum_tracking_altitude_m: 0.0
    hover_settle_sec: 0.8
    hover_velocity_tolerance_mps: 0.15
    tracking_handoff_sec: 0.75
    command_blend_sec: 0.25
    max_command_position_jump_m: 0.35
    max_command_velocity_jump_mps: 1.5
    max_yaw_rate_radps: 0.6
    max_yaw_acceleration_radps2: 0.8
    kp: [1.5, 1.5, 1.8]
    kv: [1.2, 1.2, 1.4]
    ki: [0.10, 0.10, 0.15]
    integral_limit_mps2: [0.40, 0.40, 0.50]
    integral_enable_velocity_error_mps: 0.60
    enable_cdm_feedforward: false
    cdm_joint_state_topic: /joint_states
    cdm_odometry_topic: /fmu/out/vehicle_odometry
    cdm_state_timeout_sec: 0.20
    cdm_max_acceleration_mps2: 1.0
    cdm:
      total_mass_kg: 2.843243
      arm_mass_kg: 0.325331
      base_inertia_xx: 0.02684785
      base_inertia_yy: 0.02690653
      base_inertia_zz: 0.02385432
      joint_offset_12_m: [0.198, 0.0005, -0.024]
      joint_offset_23_m: [0.194, -0.0005, 0.0]
      link_mass_kg: [0.12418, 0.11778, 0.083371]
      link_com_m: [0.156980, 0.019388, -0.0082101,
                   0.144410, 0.018876, 8.2381e-7,
                   0.071417896813, 0.018996302624, 0.010302221502]
      link_inertia_kg_m2: [3.0533e-5, 1.8411e-9, -1.1909e-9,
                           1.8411e-9, 8.0863e-5, 1.5749e-8,
                           -1.1909e-9, 1.5749e-8, 7.8412e-5,
                           1.9771e-5, 3.3851e-8, -5.9263e-11,
                           3.3851e-8, 5.6465e-5, 1.1813e-13,
                           -5.9263e-11, 1.1813e-13, 6.3243e-5,
                           3.063625451122e-5, 8.370556733279e-9, 2.758764487371e-6,
                           8.370556733279e-9, 7.715607141505e-5, -2.583337077642e-9,
                           2.758764487371e-6, -2.583337077642e-9, 5.766176007008e-5]
